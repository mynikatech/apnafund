<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ApnaFund Support Notification</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f4f6f8;
            font-family: Arial, Helvetica, sans-serif;
            color: #333;
        }

        .container {
            max-width: 640px;
            margin: 30px auto;
            background: #ffffff;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .header {
            background-color: #1f2937;
            color: #ffffff;
            padding: 16px 24px;
            font-size: 18px;
            font-weight: bold;
        }

        .content {
            padding: 24px;
            line-height: 1.6;
        }

        .label {
            font-weight: bold;
            margin-top: 12px;
        }

        .value {
            margin-top: 4px;
            color: #111827;
        }

        .message-box {
            margin-top: 16px;
            padding: 16px;
            background: #f9fafb;
            border-left: 4px solid #2563eb;
            white-space: pre-wrap;
        }

        .footer {
            padding: 16px 24px;
            font-size: 12px;
            color: #6b7280;
            background: #f3f4f6;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        ApnaFund – Support Notification
    </div>

    <div class="content">
        <div class="label">Source</div>
        <div class="value">{{SOURCE}}</div>

        <div class="label">User Email</div>
        <div class="value">{{USER_EMAIL}}</div>

        <div class="label">Created At</div>
        <div class="value">{{CREATED_AT}}</div>

        <div class="label">Message</div>
        <div class="message-box">
            {{MESSAGE_BODY}}
        </div>
    </div>

    <div class="footer">
        This email was generated automatically by ApnaFund.<br/>
        Please do not reply to this email.
    </div>
</div>

</body>
</html>
