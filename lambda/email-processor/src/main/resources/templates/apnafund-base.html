<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>ApnaFund Notification</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f6f8; font-family: Arial, Helvetica, sans-serif;">

<table width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f6f8; padding:20px 0;">
    <tr>
        <td align="center">

            <!-- Main container -->
            <table width="600" cellpadding="0" cellspacing="0"
                   style="background-color:#ffffff; border-radius:8px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,0.05);">

                <!-- Header -->
                <tr>
                    <td align="center" style="padding:24px 20px; background-color:#ffffff;">
                        <img
                                src="https://apnafund-assets.s3.ap-south-1.amazonaws.com/ApnaFund.png"
                                alt="ApnaFund"
                                width="140"
                                style="display:block; border:0; outline:none;"
                        />
                    </td>
                </tr>

                <!-- Divider -->
                <tr>
                    <td style="height:1px; background-color:#e5e7eb;"></td>
                </tr>

                <!-- Body -->
                <tr>
                    <td style="padding:28px 32px; color:#111827;">
                        <h2 style="margin:0 0 16px; font-size:20px; color:#111827;">
                            Hi {{USER_NAME}},
                        </h2>

                        <p style="margin:0 0 14px; font-size:14px; line-height:1.6; color:#374151;">
                            {{MESSAGE_BODY}}
                        </p>

                        <p style="margin:20px 0 0; font-size:14px; line-height:1.6; color:#374151;">
                            If you have any questions, feel free to reach out to us anytime.
                        </p>

                        <p style="margin:24px 0 0; font-size:14px; color:#374151;">
                            Regards,<br />
                            <strong>ApnaFund Team</strong>
                        </p>
                    </td>
                </tr>

                <!-- Footer -->
                <tr>
                    <td style="background-color:#f9fafb; padding:18px 32px; text-align:center;">
                        <p style="margin:0; font-size:12px; color:#6b7280;">
                            © 2026 ApnaFund. All rights reserved.
                        </p>
                        <p style="margin:6px 0 0; font-size:12px; color:#9ca3af;">
                            This is an automated message. Please do not reply.
                        </p>
                    </td>
                </tr>

            </table>
            <!-- End container -->

        </td>
    </tr>
</table>

</body>
</html>
