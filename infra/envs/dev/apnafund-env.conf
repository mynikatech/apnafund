###########################################
# ApnaFund DEV Environment Configuration
###########################################

# ----- Environment Mode -----
ENV=dev

# ----- Server / Ktor Port -----
# Ktor will run internally on port 8080
PORT=8080

# ----- Domain for Nginx + SSL -----
# Replace with your actual dev domain if required.
# If dev doesn't use a domain yet, leave blank or use EC2 public DNS.
APNAFUND_DOMAIN=api-dev.apnafund.mynikatech.in

# Admin email needed for Let's Encrypt SSL generation
ADMIN_EMAIL=support@mynikatech.in

###########################################
# Database Configuration (DEV)
###########################################

DB_HOST=<DEV_DB_HOST>
DB_PORT=5432
DB_NAME=ApnaFund          # You use same DB name for dev
DB_USER=apnafund_dev_user
AWS_SECRET_DB=apnafund/dev/deploy_pass
DB_SCHEMA=apnafunddev     # Dev schema used in your scripts

###########################################
# JDBC Connection Pool Settings
###########################################

DB_POOL_SIZE=10
DB_MIN_IDLE=1
DB_CONNECT_TIMEOUT_MS=30000
DB_IDLE_TIMEOUT_MS=600000
DB_MAX_LIFETIME_MS=1800000

###########################################
# Optional Flags
###########################################

# Disable Flyway during manual testing (uncomment if ever needed)
# SKIP_FLYWAY=1

# Disable DB connection check on startup (not recommended)
# SKIP_DB=1
