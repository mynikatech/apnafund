ktor-server-call-id      = { module = "io.ktor:ktor-server-call-id", version.ref = "ktorVer" }
ktor-server-status-pages = { module = "io.ktor:ktor-server-status-pages", version.ref = "ktorVer" }

exposed-kotlin-datetime = { module = "org.jetbrains.exposed:exposed-kotlin-datetime", version.ref = "exposed" }
exposed-java-time = { module = "org.jetbrains.exposed:exposed-java-time", version.ref = "exposed" }
[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
devtools-ksp = {id = "com.google.devtools.ksp", version.ref = "ksp"}
navigation-safeargs = {id = "androidx.navigation.safeargs.kotlin", version.ref = "navFragment" }
google-services = { id = "com.google.gms.google-services", version.ref = "google-services"}
kotlin-jvm  = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ktor-io = { id = "io.ktor.plugin", version.ref = "ktorVer" }
liquibase-gradle = { id = "org.liquibase.gradle", version.ref = "liquibaseGradVer"}
