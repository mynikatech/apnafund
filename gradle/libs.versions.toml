exposed-core = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
exposed-jdbc = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed" }
exposed-dao = { module = "org.jetbrains.exposed:exposed-dao", version.ref = "exposed" }
ktor-client-android              = { module = "io.ktor:ktor-client-android",             version.ref = "ktorVer" }
ktor-client-content-negotiation  = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktorVer" }
ktor-client-logging              = { module = "io.ktor:ktor-client-logging",             version.ref = "ktorVer" }
jdbi-core = {module= "org.jdbi:jdbi3-core", version.ref="jdbiVer"}
