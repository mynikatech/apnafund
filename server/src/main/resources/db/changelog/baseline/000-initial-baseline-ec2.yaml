databaseChangeLog:
  # ------------- 0. Create Schema (idempotent) -------------
  - changeSet:
      id: 000-create-schema
      author: devuser
      labels: baselineSchema
      context: dev
      preConditions:
        - sqlCheck:
            expectedResult: "0"
            sql: "SELECT COUNT(*) FROM pg_namespace WHERE nspname = '${schemaName}'"
          onFail: MARK_RAN
      changes:
          - sql: |
                CREATE SCHEMA IF NOT EXISTS "${schemaName}";
      rollback:
          - sql: "DROP SCHEMA IF EXISTS ${schemaName} CASCADE;"

  # ------------- 1. Set search_path -------------
  - changeSet:
      id: 000-set-search-path
      author: devuser
      labels: baselineSchema
      context: dev
      changes:
        - sql: |
            SET search_path TO "${schemaName}", pg_catalog;

  # ------------- 2. Bootstrap DB Roles -------------
  - changeSet:
      id: 005-bootstrap-db-roles
      author: devuser
      labels: baselineSchema
      context: dev
      changes:
        - sqlFile:
            path: 0000-ec2-dev-bootstrap.sql
            relativeToChangelogFile: true
            expandExpressions: true
            splitStatements: false
            stripComments: false
            endDelimiter: ";"

