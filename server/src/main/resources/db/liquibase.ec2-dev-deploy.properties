# EC2 (dev) via SSM tunnel; Postgres container is on the EC2 host
url=jdbc:postgresql://127.0.0.1:15432/apnafund
username=apnafund_dev_deploy
# password is passed at runtime with --password

defaultSchemaName=apnafunddev
apnafund.schema=apnafunddev
liquibase.liquibaseSchemaName=apnafunddev

# Use the EC2-safe baseline that creates schema if missing
changeLogFile=resources/db/changelog/db.changelog-ec2master.yaml

liquibase.hub.mode=off
logLevel=info
classpath=.
