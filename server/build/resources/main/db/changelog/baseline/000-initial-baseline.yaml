databaseChangeLog:
  # You can override this via liquibase.properties per environment (dev/prod)
  - property:
      name: schemaName
      value: ${appSchemaName}

  # 1) Core tables (create base tables first)
  - changeSet:
      id: 000-set-search-path
      author: devuser
      labels: baseline
      changes:
        - sql:
            sql: SET search_path TO "${schemaName}", pg_catalog;

  - changeSet:
      id: 010-tables
      author: devuser
      labels: baseline
      changes:
        - sqlFile:
            path: sql/010-tables.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: false
            endDelimiter: ";"
            expandExpressions: true

  # 2) Objects in dependency order (adjust as needed)
  - changeSet:
      id: 020-index
      author: devuser
