##
## apnafund.conf — NGINX site-level config
##

###############################
# Helper variable for WebSocket upgrade
# MUST be declared outside server {} blocks
###############################
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

###############################
# HTTP → HTTPS + Let's Encrypt
###############################
server {
    listen 80;
    listen [::]:80;
    server_name {{DOMAIN}};

    # ACME verification
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

###############################
# HTTPS — Main Application
###############################
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name {{DOMAIN}};

    ###############################
    # SSL certificate paths
    ###############################
    ssl_certificate     {{FULLCHAIN}};
    ssl_certificate_key {{PRIVKEY}};

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    ###############################
    # Security Headers
    ###############################
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Permissions-Policy "geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    ###############################
    # Logs
    ###############################
    access_log /var/log/nginx/apnafund.access.log;
    error_log  /var/log/nginx/apnafund.error.log warn;

    ###############################
    # Static hosting
    ###############################
    root /var/www/apnafund;
    index index.html;

    # Health check
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "OK";
    }

    # Static assets cache rules
    location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|ico|webp|ttf|woff|woff2|eot)$ {
        expires max;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    ###############################
    # Proxy → Ktor backend
    ###############################
    location / {
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSockets
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;

        proxy_buffering off;
        proxy_redirect off;

        proxy_pass http://127.0.0.1:8080;
    }
}
